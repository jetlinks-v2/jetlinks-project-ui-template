name: Publish UI parent SNAPSHOT

on:
  push:
    branches: ["2.12", "2.20"]

permissions:
  contents: read

concurrency:
  group: snapshot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Verify SNAPSHOT version
        run: |
          version="$(mvn --batch-mode --quiet --non-recursive --settings .mvn/settings.xml help:evaluate -Dexpression=project.version -DforceStdout -Dstyle.color=never)"
          case "$version" in
            *-SNAPSHOT) ;;
            *) echo "Only SNAPSHOT publication is supported" >&2; exit 1 ;;
          esac
      - name: Deploy parent SNAPSHOT
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          : "${MAVEN_USERNAME:?MAVEN_USERNAME is required}"
          : "${MAVEN_PASSWORD:?MAVEN_PASSWORD is required}"
          mvn --batch-mode --update-snapshots --non-recursive clean deploy --settings .mvn/settings.xml
